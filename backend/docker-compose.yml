services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: build
    command: npm run dev
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/university
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ""
      REDIS_PASSWORD: ""
      # AI quiz generation; RAG_SERVICE_TOKEN comes from .env and must match
      # rag-service/.env.
      RAG_SERVICE_URL: http://rag-service:8000
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Python RAG service that generates quiz questions from course PDFs.
  # Reads ../rag-service/.env (copy .env.example there first). Not published
  # to the host: only the API container talks to it.
  rag-service:
    build:
      context: ../rag-service
    env_file:
      - path: ../rag-service/.env
        required: false
    volumes:
      - rag_index:/data/index
    expose:
      - "8000"

volumes:
  postgres_data:
  rag_index:
